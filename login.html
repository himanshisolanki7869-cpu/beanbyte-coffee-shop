<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeanByte Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Modern Font aur Reset */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background: linear-gradient(135deg, #FDFBF7 0%, #EADFD5 100%); /* Soft warm premium gradient */
            padding: 20px; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            -webkit-font-smoothing: antialiased;
        }
        
        /* Sleek Symmetrical Minimal Card */
        .login-card { 
            background: #ffffff; 
            padding: 40px; 
            border-radius: 16px; /* Smooth rounded corners */
            box-shadow: 0 20px 50px rgba(95, 74, 60, 0.08); /* Soft elegant shadow */
            width: min(400px, 100%); 
            transition: all 0.3s ease;
        }
        
        /* Minimal Logo Text / Header */
        .login-card h1 { 
            margin-bottom: 28px; 
            font-size: 28px; 
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #3b2417; 
            text-align: center; 
        }

        /* Clean Functional Tabs */
        .tabs { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
            margin-bottom: 28px; 
            background: #f8f5f2;
            padding: 4px;
            border-radius: 10px;
        }
        .login-card .tab-btn { 
            background: transparent; 
            color: #7c6250; 
            border: none;
            padding: 10px; 
            font-size: 14px; 
            font-weight: 600;
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.2s ease;
        }
        .login-card .tab-btn.active { 
            background: #ffffff; 
            color: #3b2417; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        /* Form Layout & Labels */
        .login-card label { 
            display: block; 
            margin-bottom: 6px; 
            font-weight: 600; 
            font-size: 13px;
            letter-spacing: 0.2px;
            color: #5f4a3c; 
        }
        
        /* Sleek Modern Inputs */
        .login-card input { 
            width: 100%; 
            padding: 14px 16px; 
            margin-bottom: 20px; 
            border: 1px solid #e4ded9; 
            background: #faf9f7;
            border-radius: 10px; 
            font-size: 14px;
            color: #3b2417;
            transition: all 0.2s ease;
        }
        .login-card input::placeholder {
            color: #b0a49c;
        }
        .login-card input:focus {
            outline: none;
            border-color: #3b2417;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(59, 36, 23, 0.05); /* Premium focus ring */
        }

        /* Spacing for button alignment */
        .login-card form input:last-of-type {
            margin-bottom: 28px;
        }
        
        /* Premium Solid Button */
        .login-card button[type="submit"] { 
            width: 100%; 
            border: none; 
            background: #3b2417; 
            color: #ffffff; 
            padding: 15px 16px; 
            border-radius: 10px; 
            font-size: 15px; 
            font-weight: 600;
            letter-spacing: 0.3px;
            cursor: pointer; 
            transition: background 0.2s ease, transform 0.1s ease;
        }
        .login-card button[type="submit"]:hover { 
            background: #27170e; 
        }
        .login-card button[type="submit"]:active { 
            transform: scale(0.99); 
        }
        
        /* Muted Message Alert */
        .message { margin-top: 14px; color: #a35a2a; min-height: 24px; font-size: 13px; text-align: center; font-weight: 500; }
        .hint { color: #8a7566; font-size: 13px; line-height: 1.5; margin: -8px 0 20px; text-align: center; }
        
        /* Clean Minimal Links Footer */
        .secondary-actions { 
            display: flex; 
            justify-content: space-between; 
            gap: 16px; 
            margin-top: 16px; 
            padding-top: 20px;
            align-items: center; 
            border-top: 1px solid #f4efeb; 
        }
        
        /* Text Links Overrides */
        .login-card .text-link, .back-link { 
            color: #7c6250; 
            text-decoration: none; 
            background: none !important; 
            border: 0; 
            padding: 0 !important; 
            width: auto !important; 
            font: inherit; 
            cursor: pointer; 
            font-size: 13px;
            font-weight: 500;
            transition: color 0.2s ease;
        }
        .login-card .text-link:hover, .back-link:hover { 
            background: none !important; 
            color: #3b2417;
            text-decoration: underline;
        }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1 id="form-title">Login to BeanByte</h1>
        <div class="tabs" id="auth-tabs">
            <button type="button" class="tab-btn active" id="show-login">Login</button>
            <button type="button" class="tab-btn" id="show-signup">Sign Up</button>
        </div>
        
        <form id="login-form">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="admin or admin@beanbyte.com" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="coffee123" required>

            <button type="submit">Login</button>
        </form>

        <form id="signup-form" class="hidden">
            <label for="signup-username">Username</label>
            <input type="text" id="signup-username" name="username" placeholder="yourname" minlength="3" required>

            <label for="signup-email">Email</label>
            <input type="email" id="signup-email" name="email" placeholder="you@example.com" required>

            <label for="signup-password">Password</label>
            <input type="password" id="signup-password" name="password" minlength="6" required>

            <button type="submit">Create Account</button>
        </form>

        <form id="forgot-form" class="hidden">
            <p class="hint">Enter your username or email. For this demo, the reset link is shown on screen instead of being sent by email.</p>
            <label for="forgot-identifier">Username or email</label>
            <input type="text" id="forgot-identifier" name="identifier" placeholder="admin@beanbyte.com" required>

            <button type="submit">Create Reset Link</button>
        </form>

        <form id="reset-form" class="hidden">
            <label for="reset-token">Reset token</label>
            <input type="text" id="reset-token" name="token" required>

            <label for="new-password">New password</label>
            <input type="password" id="new-password" name="password" minlength="6" required>

            <button type="submit">Reset Password</button>
        </form>

        <div class="message" id="message"></div>
        
        <div class="secondary-actions">
            <button type="button" class="text-link" id="forgot-link">Forgot password?</button>
            <button type="button" class="text-link hidden" id="login-link">Back to login</button>
            <a class="back-link" href="menu.html">Back to shop</a>
        </div>
    </div>

    <script>
        const API_BASE = window.location.port === '8000' ? 'http://127.0.0.1:5000' : '';
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const forgotForm = document.getElementById('forgot-form');
        const resetForm = document.getElementById('reset-form');
        const message = document.getElementById('message');
        const formTitle = document.getElementById('form-title');
        const forgotLink = document.getElementById('forgot-link');
        const loginLink = document.getElementById('login-link');
        const resetTokenInput = document.getElementById('reset-token');
        const showLoginBtn = document.getElementById('show-login');
        const showSignupBtn = document.getElementById('show-signup');
        const authTabs = document.getElementById('auth-tabs');

        function showMessage(text, type = 'info') {
            message.style.color = type === 'error' ? '#e74c3c' : '#a35a2a';
            message.innerHTML = text;
        }

        function showForm(formName) {
            loginForm.classList.toggle('hidden', formName !== 'login');
            signupForm.classList.toggle('hidden', formName !== 'signup');
            forgotForm.classList.toggle('hidden', formName !== 'forgot');
            resetForm.classList.toggle('hidden', formName !== 'reset');
            forgotLink.classList.toggle('hidden', formName !== 'login');
            loginLink.classList.toggle('hidden', formName === 'login');
            authTabs.classList.toggle('hidden', formName === 'forgot' || formName === 'reset');
            showLoginBtn.classList.toggle('active', formName === 'login');
            showSignupBtn.classList.toggle('active', formName === 'signup');
            message.textContent = '';

            if (formName === 'forgot') formTitle.textContent = 'Forgot Password';
            if (formName === 'reset') formTitle.textContent = 'Reset Password';
            if (formName === 'login') formTitle.textContent = 'Login to BeanByte';
            if (formName === 'signup') formTitle.textContent = 'Create Account';
        }

        forgotLink.addEventListener('click', () => showForm('forgot'));
        loginLink.addEventListener('click', () => showForm('login'));
        showLoginBtn.addEventListener('click', () => showForm('login'));
        showSignupBtn.addEventListener('click', () => showForm('signup'));

        const params = new URLSearchParams(window.location.search);
        if (params.has('reset_token')) {
            resetTokenInput.value = params.get('reset_token');
            showForm('reset');
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            message.textContent = '';
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_BASE}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const result = await response.json();
                if (response.ok) {
                    if (result.user && result.user.is_owner) {
                        showMessage('Owner login successful. Opening database dashboard...');
                        window.setTimeout(() => window.location.href = '/admin', 600);
                    } else {
                        showMessage('Login successful. You can continue ordering from the menu.');
                        window.setTimeout(() => window.location.href = '/menu.html', 800);
                    }
                } else {
                    showMessage(result.error || 'Login failed.', 'error');
                }
            } catch (err) {
                showMessage('Unable to reach backend. Make sure Flask is running on port 5000.', 'error');
                console.error(err);
            }
        });

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('signup-username').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;

            try {
                const response = await fetch(`${API_BASE}/api/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                const result = await response.json();
                if (response.ok) {
                    showMessage('Account created. Taking you to the menu...');
                    window.setTimeout(() => window.location.href = '/menu.html', 800);
                } else {
                    showMessage(result.error || 'Signup failed.', 'error');
                }
            } catch (err) {
                showMessage('Unable to reach backend. Make sure Flask is running on port 5000.', 'error');
                console.error(err);
            }
        });

        forgotForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const identifier = document.getElementById('forgot-identifier').value.trim();

            try {
                const response = await fetch(`${API_BASE}/api/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: identifier })
                });
                const result = await response.json();

                if (!response.ok) {
                    showMessage(result.error || 'Unable to create reset link.', 'error');
                    return;
                }

                if (result.reset_token) {
                    resetTokenInput.value = result.reset_token;
                    showForm('reset');
                    showMessage(`Reset token created. Use this token now: <strong>${result.reset_token}</strong>`);
                } else {
                    showMessage(result.message);
                }
            } catch (err) {
                showMessage('Unable to reach backend. Make sure Flask is running on port 5000.', 'error');
                console.error(err);
            }
        });

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const token = resetTokenInput.value.trim();
            const password = document.getElementById('new-password').value;

            try {
                const response = await fetch(`${API_BASE}/api/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });
                const result = await response.json();

                if (response.ok) {
                    showForm('login');
                    showMessage(result.message);
                    resetForm.reset();
                } else {
                    showMessage(result.error || 'Unable to reset password.', 'error');
                }
            } catch (err) {
                showMessage('Unable to reach backend. Make sure Flask is running on port 5000.', 'error');
                console.error(err);
            }
        });
    </script>
</body>
</html>
