<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeanByte Login</title>

    <link rel="stylesheet" href="Login.css">
</head>

<body>

    <div class="login-box">

        <!-- Logo -->

        <div class="logo">

            <img src="logo.png" alt="BeanByte Logo">

            <div class="logo-text">

                <h2>
                    <span class="bean">Bean</span><span class="byte">Byte</span>
                </h2>

                <p class="tagline">Brewed for you</p>

            </div>

        </div>

        <!-- Heading -->

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Brew your perfect coffee experience with BeanByte.
        </p>

        <!-- Form -->

        <form>

            <input type="email" placeholder="Email Address" required>

            <input type="password" placeholder="Password" required>

            <button type="submit">Login</button>

        </form>

        <!-- Bottom Text -->

        <p class="bottom-text">
            Don’t have an account?
            <a href="signup.html">Sign Up</a>
        </p>

    </div>

</body>
</html>
